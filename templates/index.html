<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin - SCADA Dashboard</title>
    <style>
        :root { 
            --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; 
            --green: #00e676; --yellow: #ffea00; --red: #ff1744; --accent: #29b6f6; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; 
        }
        h1 { 
            text-align: center; color: var(--accent); 
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; 
        }
        .card { 
            background-color: var(--card); border-radius: 10px; padding: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-top: 4px solid var(--accent); 
            transition: all 0.3s ease; 
        }
        .card h2 { 
            margin-top: 0; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .badge { 
            padding: 5px 10px; border-radius: 20px; font-size: 12px; 
            font-weight: bold; text-transform: uppercase; 
        }
        
        /* Starile de functionare */
        .status-RUN { background-color: rgba(0, 230, 118, 0.1); color: var(--green); border: 1px solid var(--green); }
        .status-WARNING { background-color: rgba(255, 234, 0, 0.1); color: var(--yellow); border: 1px solid var(--yellow); }
        .status-FAULT { 
            background-color: rgba(255, 23, 68, 0.1); color: var(--red); 
            border: 1px solid var(--red); animation: pulse 1s infinite; 
        }

        .data-section { margin-top: 15px; }
        .data-row { 
            display: flex; justify-content: space-between; margin-bottom: 8px; 
            font-size: 14px; border-bottom: 1px dashed #333; padding-bottom: 4px;
        }
        .degradation-bar { 
            width: 100%; background-color: #333; height: 12px; 
            border-radius: 6px; margin-top: 8px; overflow: hidden; 
        }
        .degradation-fill { height: 100%; transition: width 0.3s; }
        
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); } 
            70% { box-shadow: 0 0 0 10px rgba(255, 23, 68, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); } 
        }
        .footer { text-align: center; font-size: 12px; color: #888; margin-top: 40px; }
    </style>
</head>
<body>
    <h1>🌐 Festo Digital Twin - Live Monitor</h1>
    <div class="grid" id="dashboard"></div>
    <div class="footer" id="last-update">Conectare la sistem...</div>

    <script>
        function updateDashboard() {
            fetch('/api/live')
                .then(response => response.json())
                .then(data => {
                    const dashboard = document.getElementById('dashboard');
                    dashboard.innerHTML = ''; // Golim grid-ul pentru noile date

                    // Sortam statiile alfabetic si construim interfata dinamic
                    Object.keys(data).sort().forEach(stationName => {
                        const station = data[stationName];
                        
                        // Logica de Alarme (Mentenanta Predictiva vizuala)
                        let statusClass = 'status-RUN';
                        let barColor = 'var(--green)';
                        
                        if (station.health.degradation_score >= 0.7) {
                            statusClass = 'status-WARNING';
                            barColor = 'var(--yellow)';
                        }
                        if (station.health.state === 'FAULT') {
                            statusClass = 'status-FAULT';
                            barColor = 'var(--red)';
                        }

                        // Generam HTML-ul pentru masuratori (senzori)
                        let measurementsHtml = '';
                        for (const [key, value] of Object.entries(station.measurements)) {
                            // Inlocuim underscore cu spatiu pentru estetica (ex: cycle_time -> cycle time)
                            let prettyKey = key.replace(/_/g, ' '); 
                            measurementsHtml += `<div class="data-row"><span style="text-transform: capitalize;">${prettyKey}</span><strong>${value}</strong></div>`;
                        }

                        // Construim Cardul Statiei
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // Calculam procentul de degradare
                        let degPercent = (station.health.degradation_score * 100).toFixed(1);
                        if (degPercent > 100) degPercent = 100;

                        card.innerHTML = `
                            <h2>${stationName} <span class="badge ${statusClass}">${station.health.state}</span></h2>
                            
                            <div class="data-section">
                                <div class="data-row"><span>Uzură Echipament (Degradare)</span><strong>${degPercent}%</strong></div>
                                <div class="degradation-bar">
                                    <div class="degradation-fill" style="width: ${degPercent}%; background-color: ${barColor}"></div>
                                </div>
                            </div>

                            <div class="data-section">
                                <h4 style="margin-bottom: 10px; color: #888; text-transform: uppercase; font-size: 11px; letter-spacing: 1px;">Senzori Virtuali</h4>
                                ${measurementsHtml}
                            </div>
                        `;
                        dashboard.appendChild(card);
                    });

                    document.getElementById('last-update').innerText = 'Ultima actualizare: ' + new Date().toLocaleTimeString();
                })
                .catch(err => console.error('Eroare la citirea datelor:', err));
        }

        // Prima citire instantanee, apoi actualizam o data pe secunda
        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
